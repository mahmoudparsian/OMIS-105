  <circle cx="32" cy="32" r="27" fill="none" stroke="#B5122A" stroke-width="2"/>
  <g transform="translate(13,17)">
    <!-- top bun -->
    <path d="M1 13 C1 3 37 3 37 13 L37 15 L1 15 Z" fill="#F0B266"/>
    <circle cx="11" cy="9.5" r="1.1" fill="#fff6e2"/>
    <circle cx="19" cy="8" r="1.1" fill="#fff6e2"/>
    <circle cx="27" cy="9.5" r="1.1" fill="#fff6e2"/>
    <!-- lettuce -->
    <path d="M0 15 q4.5 4 9 0 q4.5 4 9 0 q4.5 4 9 0 q4.5 4 9 0 l0 3 l-36 0 Z" fill="#67B44C"/>
