  <text x="72" y="30" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800" fill="#14110F" letter-spacing="0.4">IN·N·OUT</text>
  <text x="73" y="47" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="700" fill="#E31837" letter-spacing="2.4">POS · DUCKDB</text>
</svg>
